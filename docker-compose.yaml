version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db_inventory
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: BeATiger
      MYSQL_DATABASE: inventoryApp
      MYSQL_USER: tiger
      MYSQL_PASSWORD: AGoodPassword
    ports:
      - "3306:3306" # Standard MySQL port (or change to something else if 3306 is busy)
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin-inventory
    restart: always
    ports:
      - "1055:80" # Swapped: Now your browser uses 1055 to see the web UI
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: BeATiger
    depends_on:
      - mysql
  
volumes:
  mysql_data: